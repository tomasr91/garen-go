name: Winkeldata bijwerken (OpenStreetMap)

# Handmatig starten via Actions → "Winkeldata bijwerken" → Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:import-osm
      - name: Wijzigingen committen
        id: commit
        run: |
          if git diff --quiet -- public/data/shops.json; then
            echo "Geen wijzigingen in de winkeldata."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/shops.json
            git commit -m "Winkeldata bijgewerkt uit OpenStreetMap"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Site opnieuw publiceren
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
