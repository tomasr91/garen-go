name: Winkeldata bijwerken

# Handmatig starten via Actions → "Winkeldata bijwerken" → Run workflow.
on:
  workflow_dispatch:
    inputs:
      verkooppunten:
        description: 'Ook verkooppunten van garenmerken opnieuw ophalen (duurt ±10 minuten)'
        type: boolean
        default: true
      openingstijden:
        description: 'Openingstijden zoeken op de websites van winkels zonder tijden (duurt ±10 minuten)'
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verkooppunten garenmerken ophalen
        if: ${{ inputs.verkooppunten }}
        continue-on-error: true
        run: npm run data:dealers
      - run: npm run data:import
      - name: Openingstijden van winkelwebsites
        if: ${{ inputs.openingstijden }}
        continue-on-error: true
        run: npm run data:hours
      - name: Wijzigingen committen
        id: commit
        run: |
          if git diff --quiet -- public/data/shops.json data/sources; then
            echo "Geen wijzigingen in de winkeldata."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/shops.json data/sources
            git commit -m "Winkeldata bijgewerkt (OpenStreetMap, verkooppunten, handmatig)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Site opnieuw publiceren
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
